<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homescapes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Martian+Mono:wght@400;500&display=swap">
<style>
/* Layout: a quiet masthead, then a grid of large scene cards sized for a headset browser window. Single dark look on purpose. */
:root{
  --void:#07060d; --ink:#ece8ff; --dim:#9a93c4; --pink:#ff3fd2; --cyan:#3ff0ff; --panel:#110d22; --line:rgba(140,120,255,.28);
  --display:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --mono:"Martian Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);color:var(--ink);font-family:var(--mono)}
main{max-width:1200px;margin:0 auto;padding-block:40px 56px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:32px}
header{display:grid;gap:8px}
.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--cyan);text-transform:uppercase}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,56px);letter-spacing:.03em;line-height:1;text-wrap:balance}
.lede{margin:0;max-width:60ch;font-size:13px;line-height:1.6;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:20px}
.card{display:grid;grid-template-rows:auto 1fr;background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;color:inherit;text-decoration:none;transition:border-color .15s, transform .15s}
.card:hover,.card:focus-visible{border-color:var(--cyan);transform:translateY(-2px);outline:none}
.card:focus-visible{box-shadow:0 0 0 2px var(--cyan)}
.thumb{aspect-ratio:16/9;width:100%;max-width:100%;object-fit:cover;display:block;background:#0c0a18}
.body{display:grid;gap:8px;padding:16px 18px 18px;align-content:start}
.card h2{margin:0;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.03em}
.card p{margin:0;font-size:12px;line-height:1.55;color:var(--dim)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tags span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);border:1px solid var(--line);border-radius:2px;padding:4px 7px}
.go{margin-top:6px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink)}
.empty{border:1px dashed var(--line);border-radius:4px;padding:24px;font-size:12px;line-height:1.6;color:var(--dim)}
footer{font-size:11px;line-height:1.6;color:var(--dim);border-top:1px solid var(--line);padding-top:18px;max-width:70ch}
footer b{color:var(--ink);font-weight:500}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<main>
  <header>
    <span class="eyebrow">Quest 3 · WebXR</span>
    <h1>Homescapes</h1>
    <p class="lede">Pick a place. Each one opens in this browser; tap <b style="color:var(--ink);font-weight:500">Enter VR</b> inside to step in.</p>
  </header>
  <section class="grid" id="grid" aria-label="Homescapes"></section>
  <footer>Best in the <b>Meta Quest Browser</b>. Scenes are 20–30 MB, so the first load takes a few seconds. Sound starts after your first tap.</footer>
</main>
<script>
const grid = document.getElementById('grid');
function card(s){
  const a = document.createElement('a'); a.className = 'card'; a.href = s.path;
  const img = document.createElement('img'); img.className = 'thumb'; img.src = s.thumb; img.alt = s.alt || (s.name + ' preview'); img.loading = 'lazy';
  const body = document.createElement('div'); body.className = 'body';
  const h = document.createElement('h2'); h.textContent = s.name;
  const p = document.createElement('p'); p.textContent = s.description;
  const tags = document.createElement('div'); tags.className = 'tags';
  (s.tags || []).forEach(t => { const x = document.createElement('span'); x.textContent = t; tags.appendChild(x); });
  const go = document.createElement('div'); go.className = 'go'; go.textContent = 'Open';
  body.append(h, p, tags, go); a.append(img, body); return a;
}
fetch('scenes.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(list => { if (!list.length) throw new Error('empty'); list.forEach(s => grid.appendChild(card(s))); })
  .catch(() => { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'The scene list could not be loaded. Check that scenes.json sits next to this page.'; grid.appendChild(d); });
</script>
</body>
</html>
